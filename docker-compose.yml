version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: certiverify
      POSTGRES_PASSWORD: certiverify
      POSTGRES_DB: certiverify
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certiverify"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://certiverify:certiverify@db:5432/certiverify
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        - BACKEND_URL=http://backend:8000
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Local blockchain for Module 6 (Blockchain Verification):
  # ganache:
  #   image: trufflesuite/ganache:latest
  #   ports:
  #     - "8545:8545"
  #   command: --wallet.deterministic

volumes:
  pgdata:
  uploads:
